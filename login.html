<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login Ruang Baca</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="#">Beranda</a>
                <a class="nav-link text-white" href="#">Tentang</a>
                <a class="nav-link text-white" href="#">Bantuan</a>
            </div>
        </div>
    </nav>

    <!-- Form Login -->
    <main class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">

                <div class="card border-0 shadow">
                    <div class="card-body p-4">

                        <h3 class="text-center fs-4 mb-2">
                            Masuk ke Ruang Baca
                        </h3>

                        <p class="text-center text-secondary small mb-4">
                            Temukan bacaan untuk hari ini.
                        </p>

                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       id="username"
                                       class="form-control"
                                       placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       id="password"
                                       class="form-control"
                                       placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox"
                                       id="ingatSaya"
                                       class="form-check-input">
                                <label for="ingatSaya"
                                       class="form-check-label">
                                    Ingat saya
                                </label>
                            </div>

                            <button type="button"
                                    class="btn btn-success w-100">
                                Masuk
                            </button>
                        </form>
                    </div>

                    <div class="card-footer text-center bg-white py-3">
                        <a href="#" class="text-success small">
                            Lupa password?
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
